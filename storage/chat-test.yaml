apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-coturn
  namespace: larakube-shared
  labels:
    app: chat-coturn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-coturn
  template:
    metadata:
      labels:
        app: chat-coturn
    spec:
      containers:
        - name: coturn
          image: coturn/coturn:4.6.3-alpine
          ports:
            - containerPort: 3478
              protocol: UDP
              hostPort: 3478
            - containerPort: 3478
              protocol: TCP
              hostPort: 3478
          volumeMounts:
            - name: config
              mountPath: /etc/coturn/turnserver.conf
              subPath: turnserver.conf
      volumes:
        - name: config
          secret:
            secretName: chat-coturn-config
---
