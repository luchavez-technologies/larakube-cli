apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-synapse
  namespace: larakube-shared
  labels:
    app: chat-synapse
    app.kubernetes.io/part-of: chat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chat-synapse
  template:
    metadata:
      labels:
        app: chat-synapse
      annotations:
        larakube.io/config-checksum: "266c14d12db09aab"
    spec:
      initContainers:
        - name: install-s3-provider
          image: matrixdotorg/synapse:v1.120.0
          command: ["sh", "-c", "mkdir -p /data/site-packages && pip install --no-deps --no-cache-dir --target=/data/site-packages synapse-s3-storage-provider boto3 botocore humanize tqdm s3transfer jmespath"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: synapse
          image: matrixdotorg/synapse:v1.120.0
          env:
            - name: PYTHONPATH
              value: "/data/site-packages"
          ports:
            - containerPort: 8008
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /data/homeserver.yaml
              subPath: homeserver.yaml
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chat-synapse-data
        - name: config
          secret:
            secretName: chat-synapse-config
---
apiVersion: v1
kind: Service
metadata:
  name: chat-synapse
  namespace: larakube-shared
spec:
  selector:
    app: chat-synapse
  ports:
    - protocol: TCP
      port: 8008
      targetPort: 8008
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-cinny-config
  namespace: larakube-shared
data:
  default.conf: |
    server {
      listen 80;
      listen [::]:80;

      location /.well-known/matrix/client {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
      }

      location / {
        root /usr/share/nginx/html;

        rewrite ^/\.well-known/matrix/client$ /.well-known/matrix/client break;
        rewrite ^/config.json$ /config.json break;
        rewrite ^/manifest.json$ /manifest.json break;

        rewrite ^/sw.js$ /sw.js break;
        rewrite ^/pdf.worker.min.js$ /pdf.worker.min.js break;

        rewrite ^/public/(.*)$ /public/$1 break;
        rewrite ^/assets/(.*)$ /assets/$1 break;

        rewrite ^(.+)$ /index.html break;
      }
    }
  config.json: |
    {
      "defaultHomeserver": 0,
      "homeserverList": [
        "chat.luchtech.dev"
      ]
    }
  client: |
    {
      "m.homeserver": {
        "base_url": "https://chat.luchtech.dev/"
      },
      "org.matrix.msc3401.call1": {
        "livekit": {
          "service_url": "https://chat.luchtech.dev/livekit"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-cinny
  namespace: larakube-shared
  labels:
    app: chat-cinny
    app.kubernetes.io/part-of: chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-cinny
  template:
    metadata:
      labels:
        app: chat-cinny
    spec:
      containers:
        - name: cinny
          image: ghcr.io/cinnyapp/cinny:v4.12.3
          ports:
            - containerPort: 80
          volumeMounts:
            - name: cinny-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: cinny-config
              mountPath: /app/config.json
              subPath: config.json
            - name: cinny-config
              mountPath: /app/.well-known/matrix/client
              subPath: client
      volumes:
        - name: cinny-config
          configMap:
            name: chat-cinny-config
---
apiVersion: v1
kind: Service
metadata:
  name: chat-cinny
  namespace: larakube-shared
spec:
  selector:
    app: chat-cinny
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat-ingress
  namespace: larakube-shared
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  rules:
    - host: chat.luchtech.dev
      http:
        paths:
          - path: /_matrix
            pathType: Prefix
            backend:
              service:
                name: chat-synapse
                port:
                  number: 8008
          - path: /_synapse
            pathType: Prefix
            backend:
              service:
                name: chat-synapse
                port:
                  number: 8008
          - path: /.well-known/matrix/client
            pathType: Exact
            backend:
              service:
                name: chat-cinny
                port:
                  number: 80
          - path: /livekit/jwt
            pathType: Prefix
            backend:
              service:
                name: chat-lk-jwt
                port:
                  number: 8080
          - path: /livekit
            pathType: Prefix
            backend:
              service:
                name: chat-livekit
                port:
                  number: 7880
          - path: /.well-known/matrix
            pathType: Prefix
            backend:
              service:
                name: chat-synapse
                port:
                  number: 8008
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chat-cinny
                port:
                  number: 80
  tls:
    - hosts:
        - chat.luchtech.dev
