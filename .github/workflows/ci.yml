name: CI

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    name: Test, Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      is_stable: ${{ steps.release_target.outputs.publish == 'true' && steps.release_target.outputs.is_canary == 'false' }}
      version: ${{ steps.release_target.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, zip, pcntl, posix, openssl, curl, phar, opcache
          ini-values: phar.readonly=0, opcache.enable_cli=1, opcache.memory_consumption=256, opcache.max_accelerated_files=20000
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/composer
            vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Check Code Style & Formatting
        run: ./vendor/bin/pint --test

      # No PHPStan here on purpose: `composer analyse` caps memory PER WORKER,
      # so a cold run over ~650 files dominates the pipeline for a check that
      # .githooks/pre-commit already runs on every commit. Nothing unanalysed
      # reaches the remote. Its `.phpstan` cache step went with it — it cached a
      # directory nothing wrote.

      # 62 sequential registry round-trips, ~5.5 minutes, and the answer only
      # changes when a pinned tag changes. Run it when a manifest (or the
      # checker) actually moved, and always on the stable release path. Not
      # skipped wholesale on develop: that is where canary binaries come from,
      # and a bad tag is a cluster OUTAGE at apply time, not a build failure —
      # see the header of scripts/check-images.php.
      - name: Detect manifest changes
        id: manifests
        run: |
          set -e
          BEFORE="${{ github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "reason=stable release path" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_OUTPUT
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "reason=no comparable parent, checking to be safe" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --name-only "$BEFORE" "${{ github.sha }}" \
               | grep -qE '^(resources/views/k8s/|scripts/check-images\.php$)'; then
            echo "reason=a manifest or the checker changed" >> $GITHUB_OUTPUT
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "reason=no manifest touched" >> $GITHUB_OUTPUT
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify Container Images
        if: steps.manifests.outputs.changed == 'true'
        run: php scripts/check-images.php

      - name: Skipping image verification
        if: steps.manifests.outputs.changed != 'true'
        run: echo "Skipped — ${{ steps.manifests.outputs.reason }}."

      - name: Run Tests
        run: composer test

      - name: Calculate Next Version
        id: version
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: php scripts/calculate-next-version.php

      - name: Determine Release Target
        id: release_target
        if: github.event_name == 'push' && (github.ref_type == 'tag' || github.ref_name == 'develop' || github.ref_name == 'main')
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "is_canary=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            echo "publish=true" >> $GITHUB_OUTPUT
            echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "tag=canary" >> $GITHUB_OUTPUT
            echo "is_canary=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "main" ]; then
            if [ "${{ steps.version.outputs.should_release }}" = "true" ]; then
              echo "publish=true" >> $GITHUB_OUTPUT
              echo "version=${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
              echo "tag=${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
              echo "is_canary=false" >> $GITHUB_OUTPUT
            else
              echo "publish=false" >> $GITHUB_OUTPUT
              echo "is_canary=false" >> $GITHUB_OUTPUT
            fi
          fi

      # `canary` is a moving tag, so develop re-points it on every publish. A
      # version tag on main is immutable: created once, never moved. A push that
      # was itself triggered by a tag already has one.
      - name: Create and Push Git Tag
        if: github.event_name == 'push' && steps.release_target.outputs.publish == 'true' && github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.release_target.outputs.tag }}"
          if [ "${{ steps.release_target.outputs.is_canary }}" = "true" ]; then
            git tag -f "$TAG" "${{ github.sha }}"
            git push --force origin "refs/tags/$TAG"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
          fi

      # SKIP_PHPSTAN because ./build runs its own analysis pass, and the
      # pre-commit hook already gated this commit.
      - name: Build Standalone Binaries
        if: steps.release_target.outputs.publish == 'true'
        run: SKIP_PHPSTAN=true ./build --all ${{ steps.release_target.outputs.version }}

      - name: Organize Artifacts
        if: steps.release_target.outputs.publish == 'true'
        run: |
          mkdir -p artifacts
          cp builds/standalone/linux/linux-x64 artifacts/larakube-linux-x64
          cp builds/standalone/linux/linux-arm artifacts/larakube-linux-arm
          cp builds/standalone/mac/mac-x64 artifacts/larakube-mac-x64
          cp builds/standalone/mac/mac-arm artifacts/larakube-mac-arm
          chmod +x artifacts/*

      # `gh` ships on the runner, so there is no third-party release action to
      # pin or audit. Canary is republished in place: its tag moved above, so
      # the old release is replaced rather than accumulating one per commit.
      - name: Publish Release
        if: steps.release_target.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_target.outputs.tag }}
          IS_CANARY: ${{ steps.release_target.outputs.is_canary }}
          RELEASE_NOTES: ${{ steps.version.outputs.release_notes }}
        run: |
          set -e
          if [ -n "$RELEASE_NOTES" ]; then
            printf '%s\n' "$RELEASE_NOTES" > /tmp/notes.md
          else
            printf 'LaraKube Standalone Binaries %s\n' "$TAG" > /tmp/notes.md
          fi

          if [ "$IS_CANARY" = "true" ]; then
            # Keep the tag (just force-moved), drop only the release body.
            gh release delete "$TAG" --yes || true
            gh release create "$TAG" artifacts/* \
              --title "Canary ($(git rev-parse --short "${{ github.sha }}"))" \
              --notes-file /tmp/notes.md \
              --prerelease
          else
            gh release create "$TAG" artifacts/* \
              --title "LaraKube CLI $TAG" \
              --notes-file /tmp/notes.md
          fi

  tap:
    name: Update Homebrew Tap
    needs: ci
    if: needs.ci.outputs.is_stable == 'true'
    runs-on: ubuntu-latest
    steps:
      # The tap is a separate repository, so GITHUB_TOKEN cannot push to it — it
      # needs a PAT. Without this gate, actions/checkout fails the run with
      # "Input required and not supplied: token" long after the binaries were
      # built and published. Read through env so the value never reaches a
      # command line.
      - name: Check tap credentials
        id: tap_token
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "TAP_GITHUB_TOKEN is not set on this repository — skipping the Homebrew tap update."
          fi

      - name: Checkout CLI repo
        if: steps.tap_token.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          path: cli

      - name: Checkout Homebrew tap
        if: steps.tap_token.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: luchavez-technologies/homebrew-larakube
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Download mac binaries and compute SHA256
        if: steps.tap_token.outputs.ok == 'true'
        run: |
          VERSION="${{ needs.ci.outputs.version }}"
          BASE_URL="https://github.com/${{ github.repository }}"
          ARM_URL="${BASE_URL}/releases/download/${VERSION}/larakube-mac-arm"
          X64_URL="${BASE_URL}/releases/download/${VERSION}/larakube-mac-x64"
          curl -fsSL "$ARM_URL" -o /tmp/larakube-mac-arm
          curl -fsSL "$X64_URL" -o /tmp/larakube-mac-x64
          echo "SHA_ARM=$(sha256sum /tmp/larakube-mac-arm | awk '{print $1}')" >> $GITHUB_ENV
          echo "SHA_X64=$(sha256sum /tmp/larakube-mac-x64 | awk '{print $1}')" >> $GITHUB_ENV
          echo "VERSION=${VERSION#v}" >> $GITHUB_ENV

      - name: Stamp formula with version and SHA256
        if: steps.tap_token.outputs.ok == 'true'
        run: |
          cp cli/homebrew-tap/Formula/larakube.rb tap/Formula/larakube.rb
          sed -i "s/LARAKUBE_VERSION/${{ env.VERSION }}/g" tap/Formula/larakube.rb
          sed -i "s/SHA256_MAC_ARM/${{ env.SHA_ARM }}/g" tap/Formula/larakube.rb
          sed -i "s/SHA256_MAC_X64/${{ env.SHA_X64 }}/g" tap/Formula/larakube.rb

      - name: Commit and push updated formula
        if: steps.tap_token.outputs.ok == 'true'
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/larakube.rb
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update LaraKube CLI to ${{ needs.ci.outputs.version }}"
          git push

  tap-canary:
    name: Update Homebrew Tap (Canary)
    needs: ci
    if: github.ref_type == 'branch' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Check tap credentials
        id: tap_token
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "TAP_GITHUB_TOKEN is not set on this repository — skipping the Homebrew tap update."
          fi

      - name: Checkout CLI repo
        if: steps.tap_token.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          path: cli

      - name: Checkout Homebrew tap
        if: steps.tap_token.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: luchavez-technologies/homebrew-larakube
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      # No checksum stamping here (the canary formula uses sha256 :no_check —
      # its binaries are overwritten in place on every push, so a pinned hash
      # would go stale immediately). Only the version string is refreshed,
      # which is what makes `brew reinstall larakube-canary` actually re-fetch
      # instead of Homebrew serving a stale cached download for an unchanged
      # version string.
      - name: Stamp canary formula with a fresh version marker
        if: steps.tap_token.outputs.ok == 'true'
        run: |
          SHORT_SHA="${{ github.sha }}"
          cp cli/homebrew-tap/Formula/larakube-canary.rb tap/Formula/larakube-canary.rb
          sed -i "s/CANARY_VERSION/canary-${SHORT_SHA:0:7}/g" tap/Formula/larakube-canary.rb

      - name: Commit and push updated canary formula
        if: steps.tap_token.outputs.ok == 'true'
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/larakube-canary.rb
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update canary formula to ${{ github.sha }}"
          git push
