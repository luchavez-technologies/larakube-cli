name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # @senior-dev: optional — pin to SHA for immutability
      #   actions/checkout@v7 → actions/checkout@<commit-sha-of-v7.0.0>
      #   shivammathur/setup-php@v2 → shivammathur/setup-php@<commit-sha-of-2.37.2>

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, zip, pcntl, posix, openssl
          coverage: none

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Audit Dependencies
        run: composer audit

      - name: Check Code Style (Pint)
        run: ./vendor/bin/pint --test

      - name: Static Analysis (PHPStan / Larastan)
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Run Tests
        run: ./vendor/bin/pest

  # ── Branch Push: Canary Release ──────────────────────────────────────────
  canary:
    name: Canary Build
    needs: test
    if: github.ref_type != 'tag' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, zip, pcntl, posix, openssl, phar
          ini-values: phar.readonly=0

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      - name: Build Standalone Binaries
        run: ./build --all ${{ github.sha }}

      - name: Organize Artifacts
        run: |
          mkdir -p artifacts
          cp builds/standalone/linux/linux-x64 artifacts/larakube-linux-x64
          cp builds/standalone/linux/linux-arm artifacts/larakube-linux-arm
          cp builds/standalone/mac/mac-x64 artifacts/larakube-mac-x64
          cp builds/standalone/mac/mac-arm artifacts/larakube-mac-arm
          chmod +x artifacts/*

      - name: Upload Binaries to Canary Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          tag_name: canary
          name: 'Canary (Main Branch)'
          body: |
            LaraKube Canary Build
            Commit: ${{ github.sha }}

            Download the binary for your platform and move it to `/usr/local/bin/larakube`.
          draft: false
          prerelease: true
          make_latest: 'false'
          generate_release_notes: true
          overwrite_files: true

  # ── Tag Push: Stable Release ─────────────────────────────────────────────
  # @senior-dev: CREATE "release" GitHub Environment:
  #   1. Repo → Settings → Environments → New Environment → name: "release"
  #   2. Required reviewers: 1 (add yourself)
  #   3. Branch filter: main
  #   4. Environment secrets: add GPG_PRIVATE_KEY + GPG_PASSPHRASE
  #
  # @senior-dev: GENERATE a GPG signing key:
  #   gpg --full-generate-key (RSA 4096, no expiry)
  #   gpg --armor --export-secret-keys <key-id>  # paste into GPG_PRIVATE_KEY
  publish:
    name: Build and Publish
    needs: test
    if: github.ref_type == 'tag'
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, zip, pcntl, posix, openssl, phar
          ini-values: phar.readonly=0

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader

      # @senior-dev: enable these steps once GPG_PRIVATE_KEY + GPG_PASSPHRASE are set
      # - name: Import GPG Key
      #   run: |
      #     echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import
      #     echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --passphrase-fd 0 --pinentry-mode loopback --sign /dev/null
      #
      # - name: Sign Phar and Generate Checksums
      #   run: |
      #     cd artifacts
      #     sha256sum * > checksums.txt
      #     gpg --detach-sign --armor checksums.txt

      - name: Build Standalone Binaries
        run: ./build --all ${{ github.ref_name }}

      - name: Organize Artifacts
        run: |
          mkdir -p artifacts
          cp builds/standalone/linux/linux-x64 artifacts/larakube-linux-x64
          cp builds/standalone/linux/linux-arm artifacts/larakube-linux-arm
          cp builds/standalone/mac/mac-x64 artifacts/larakube-mac-x64
          cp builds/standalone/mac/mac-arm artifacts/larakube-mac-arm
          chmod +x artifacts/*

      # @senior-dev: add checksums.txt + checksums.txt.asc once GPG is active
      #   files: |
      #     artifacts/*
      #     artifacts/checksums.txt
      #     artifacts/checksums.txt.asc
      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            LaraKube Standalone Binaries
            Build Date: ${{ github.event.head_commit.timestamp }}
            Commit: ${{ github.sha }}
            Version: ${{ github.ref_name }}

            Download the binary for your platform and move it to `/usr/local/bin/larakube`.
          draft: false
          prerelease: false
          make_latest: 'true'
          generate_release_notes: true
          overwrite_files: true

  # ── Homebrew Tap Update ───────────────────────────────────────────────────
  tap:
    name: Update Homebrew Tap
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout CLI repo
        uses: actions/checkout@v7
        with:
          path: cli

      # @senior-dev: create a fine-grained GitHub PAT with contents:write
      # on homebrew-larakube repo, then add as repo secret: TAP_GITHUB_TOKEN
      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: luchavez-technologies/homebrew-larakube
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Download mac binaries and compute SHA256
        run: |
          VERSION="${{ github.ref_name }}"
          ARM_URL="https://github.com/luchavez-technologies/larakube-cli/releases/download/${VERSION}/larakube-mac-arm"
          X64_URL="https://github.com/luchavez-technologies/larakube-cli/releases/download/${VERSION}/larakube-mac-x64"
          curl -fsSL "$ARM_URL" -o /tmp/larakube-mac-arm
          curl -fsSL "$X64_URL" -o /tmp/larakube-mac-x64
          echo "SHA_ARM=$(sha256sum /tmp/larakube-mac-arm | awk '{print $1}')" >> $GITHUB_ENV
          echo "SHA_X64=$(sha256sum /tmp/larakube-mac-x64 | awk '{print $1}')" >> $GITHUB_ENV
          echo "VERSION=${VERSION#v}" >> $GITHUB_ENV

      - name: Stamp formula with version and SHA256
        run: |
          cp cli/homebrew-tap/Formula/larakube.rb tap/Formula/larakube.rb
          sed -i "s/LARAKUBE_VERSION/${{ env.VERSION }}/g" tap/Formula/larakube.rb
          sed -i "s/SHA256_MAC_ARM/${{ env.SHA_ARM }}/g" tap/Formula/larakube.rb
          sed -i "s/SHA256_MAC_X64/${{ env.SHA_X64 }}/g" tap/Formula/larakube.rb

      - name: Commit and push updated formula
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/larakube.rb
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update LaraKube CLI to ${{ github.ref_name }}"
          git push
